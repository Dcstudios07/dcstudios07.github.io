<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>DC Studios — Admin</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body{padding:20px; background:#f8f9fa}
    .card-preview img{max-width:150px; max-height:120px; object-fit:cover}
  </style>
</head>
<body>
  <div class="container">
    <h3>DC Studios — Admin Panel</h3>
    <p class="text-muted">Photographer portfolio: upload images, add video link, replace/delete projects.</p>

    <div class="card p-3 mb-3">
      <div class="mb-2">
        <label>Token (Browser will ask each session)</label>
        <button id="enterTokenBtn" class="btn btn-sm btn-outline-primary ms-2">Enter Token</button>
        <span id="tokenStatus" class="ms-2 text-muted">Token: not set</span>
      </div>

      <div class="row g-2">
        <div class="col-md-6">
          <input id="title" class="form-control" placeholder="Project Title" />
        </div>
        <div class="col-md-6">
          <input id="video" class="form-control" placeholder="Video link (YouTube or Vimeo) — optional" />
        </div>
        <div class="col-12">
          <textarea id="desc" class="form-control" rows="2" placeholder="Short description"></textarea>
        </div>
        <div class="col-md-6">
          <input id="thumb" type="file" accept="image/*" class="form-control" />
        </div>
        <div class="col-md-6 d-flex align-items-center">
          <button id="addBtn" class="btn btn-success me-2">Add Project</button>
          <button id="refreshBtn" class="btn btn-secondary">Refresh List</button>
        </div>
      </div>
    </div>

    <div class="card p-3 mb-3">
      <h5>Existing Projects</h5>
      <div id="projectsList" class="list-group"></div>
    </div>

    <div id="log" class="mt-3"></div>
  </div>

  <script src="admin.js"></script>
</body>
</html>
